services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkit-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopkit

    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reload during dev
      - ./src:/app/src:ro

  db:
    image: postgres:16-alpine
    container_name: shopkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopkit"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
