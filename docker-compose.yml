services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopkit-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shopkit
      JWT_ACCESS_SECRET: a8f9b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
      JWT_REFRESH_SECRET: 7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f8e7d6c5b4a3f2e1d0c9b8a7f6e
      JWT_ACCESS_TOKEN_EXPIRE: 2m
      JWT_REFRESH_TOKEN_EXPIRE: 7d

      SUPABASE_URL: https://ddfzyqsldyfccayzxmuj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkZnp5cXNsZHlmY2NheXp4bXVqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDU3MDkxNywiZXhwIjoyMTA2MTQ2OTE3fQ.TbUQjdouG08eXitI29WrJr7cb-DhgSolJA-eaXXFeVQ
      SUPABASE_STORAGE_BUCKET: shopkit-media

    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source code for hot-reload during dev
      - ./src:/app/src:ro

  db:
    image: postgres:16-alpine
    container_name: shopkit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopkit"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    driver: local
